plugins {
    id 'com.android.application'
}

// 签名凭据不进仓库：优先读 local.properties（已被 .gitignore 忽略），其次读环境变量。
// 用法：在 local.properties 里写
//   TJ_STORE_FILE=D:\\iptv\\keys\\tj-unicom-iptv-release.jks
//   TJ_STORE_PASSWORD=xxx
//   TJ_KEY_ALIAS=tjunicom_iptv
//   TJ_KEY_PASSWORD=xxx
def tjSigningProps = new Properties()
def tjLocalProps = rootProject.file('local.properties')
if (tjLocalProps.exists()) {
    tjLocalProps.withInputStream { tjSigningProps.load(it) }
}
def tjProp = { String key, String envName ->
    def v = tjSigningProps.getProperty(key)
    return (v != null && !v.trim().isEmpty()) ? v.trim() : System.getenv(envName)
}
def tjStoreFile = tjProp('TJ_STORE_FILE', 'TJ_STORE_FILE')

android {
    namespace 'com.tjunicom.iptv'
    compileSdk 34

    defaultConfig {
        applicationId "com.tjunicom.iptv"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        release {
            if (tjStoreFile != null) {
                storeFile file(tjStoreFile)
                storePassword tjProp('TJ_STORE_PASSWORD', 'TJ_STORE_PASSWORD')
                keyAlias tjProp('TJ_KEY_ALIAS', 'TJ_KEY_ALIAS')
                keyPassword tjProp('TJ_KEY_PASSWORD', 'TJ_KEY_PASSWORD')
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (tjStoreFile != null) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            // debug 使用 Android 默认 debug keystore，避免把 release 私钥带进日常构建产物
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        pickFirst 'lib/*/libijkffmpeg.so'
        pickFirst 'lib/*/libijksdl.so'
        pickFirst 'lib/*/libijkplayer.so'
    }
}

dependencies {
    // AndroidX & UI
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Bilibili ijkplayer core & patched multi-ABI native libraries (in src/main/jniLibs with MP2 decoder enabled)
    implementation 'tv.danmaku.ijk.media:ijkplayer-java:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-exo:0.8.8'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
}
